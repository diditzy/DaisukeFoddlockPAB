# Server configuration
server.port=8080

# Database Configuration (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/daisuke_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configurations
# PENTING: Set environment variable JWT_SECRET di production. Tidak ada nilai bawaan.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Security Configurations
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Midtrans API Configurations
# PENTING: Set environment variable MIDTRANS_SERVER_KEY dan MIDTRANS_CLIENT_KEY sebelum menjalankan server
midtrans.server-key=${MIDTRANS_SERVER_KEY:}
midtrans.client-key=${MIDTRANS_CLIENT_KEY:}
midtrans.snap-url=https://app.sandbox.midtrans.com/snap/v1/transactions
midtrans.production=${MIDTRANS_IS_PRODUCTION:false}

# OpenAPI / Swagger configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tryItOutEnabled=true
